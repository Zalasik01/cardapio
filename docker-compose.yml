services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - cardapio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cardapio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: America/Sao_Paulo
      DATABASE_URL: jdbc:postgresql://postgres:5432/cardapio
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    # modo desenvolvimento: Vite com hot reload. Use `docker compose watch` (ou `up --watch`):
    # os arquivos alterados em frontend/ sao copiados para o container e a tela recarrega.
    # A imagem de producao (nginx) continua em frontend/Dockerfile.
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: /api
      API_PROXY_TARGET: http://backend:8080
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.js
          target: /app/vite.config.js
        - action: rebuild
          path: ./frontend/package.json
    depends_on:
      - backend
    ports:
      - "5173:5173"


volumes:
  cardapio_postgres_data:
