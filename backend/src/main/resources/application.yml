spring:
  application:
    name: cardapio-backend

  # dev e docker tambem carregam os dados de demonstracao (db/dev, veja abaixo); prod nao.
  profiles:
    active: dev

  datasource:
    # dev (fora do docker) usa o Postgres do docker-compose, publicado na porta 5440
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5440/cardapio}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  # O schema e gerenciado pelas migrations do Flyway (db/migration).
  # O Hibernate apenas valida que as entidades batem com o banco.
  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-min-256-bits-please-override-in-prod}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  push:
    # chaves VAPID (Web Push). Estas são só de desenvolvimento: em produção gere as suas (web-push generate-vapid-keys)
    chave-publica: ${PUSH_PUBLIC_KEY:BIeMR70WG7CUV7hCygTAsoMQAnq0qprYwn8zkWG8I6OyjFPb7vYAL8I9SJ3kt3cPI_cq1q-JPMaGYwlKCZ6Qqc0}
    chave-privada: ${PUSH_PRIVATE_KEY:oWg8W0U5TnpXZd1hyhwnV4R4LZ0_KG1-6Z-nBEdzoMs}
    contato: ${PUSH_SUBJECT:mailto:contato@corefood.com.br}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

---
# Dados de demonstracao (migration repetivel em db/dev): so em dev e docker, nunca em producao.
spring:
  config:
    activate:
      on-profile: dev,docker
  flyway:
    locations: classpath:db/migration,classpath:db/dev
